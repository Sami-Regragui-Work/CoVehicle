$kind: http-request
description: "Rule: pickup stop must come before dropoff stop in trip order."
url: "{{baseUrl}}/api/passengers/8/reservations"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tripId": "{{tripId}}",
      "pickupStopId": "{{stopMarrakech}}",
      "dropoffStopId": "{{stopSettat}}",
      "numberOfSeats": 1
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 7000
