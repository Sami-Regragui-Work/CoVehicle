$kind: http-request
url: "{{baseUrl}}/api/passengers/{{newPassengerId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "firstName": "TestUpdated",
      "lastName": "Passenger",
      "email": "{{newPassengerEmail}}",
      "phone": "0610000099"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 18000
