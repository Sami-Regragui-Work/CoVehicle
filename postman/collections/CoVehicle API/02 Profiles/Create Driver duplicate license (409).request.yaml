$kind: http-request
description: "Rule: license number must be unique."
url: "{{baseUrl}}/api/drivers"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "firstName": "Dup",
      "lastName": "Driver",
      "email": "unique_dup@test.local",
      "phone": "0600000099",
      "licenseNumber": "HAM-001"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 409', () => pm.response.to.have.status(409));
    language: text/javascript
order: 9000
