$kind: http-request
description: "Rule: cannot update passenger to use another user's email."
url: "{{baseUrl}}/api/passengers/{{newPassengerId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "firstName": "TestUpdated",
      "lastName": "Passenger",
      "email": "hamid@covehicle.local",
      "phone": "0610000099"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 409', () => pm.response.to.have.status(409));
    language: text/javascript
order: 19000
