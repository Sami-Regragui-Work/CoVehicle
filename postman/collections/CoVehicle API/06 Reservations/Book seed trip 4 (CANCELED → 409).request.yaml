url: "{{baseUrl}}/api/passengers/9/reservations"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tripId": 4,
      "pickupStopId": 11,
      "dropoffStopId": 12,
      "numberOfSeats": 1
