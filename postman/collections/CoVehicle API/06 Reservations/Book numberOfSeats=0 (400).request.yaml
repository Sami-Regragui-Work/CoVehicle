$kind: http-request
url: "{{baseUrl}}/api/passengers/9/reservations"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tripId": "{{tripId}}",
      "pickupStopId": "{{stopSettat}}",
      "dropoffStopId": "{{stopMarrakech}}",
      "numberOfSeats": 0
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 2000
