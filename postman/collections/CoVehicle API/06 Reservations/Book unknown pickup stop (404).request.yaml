$kind: http-request
url: "{{baseUrl}}/api/passengers/9/reservations"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tripId": "{{tripId}}",
      "pickupStopId": 99999,
      "dropoffStopId": "{{stopMarrakech}}",
      "numberOfSeats": 1
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 404', () => pm.response.to.have.status(404));
    language: text/javascript
order: 7000
