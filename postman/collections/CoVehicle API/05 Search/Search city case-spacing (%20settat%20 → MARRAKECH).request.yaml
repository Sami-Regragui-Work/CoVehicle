$kind: http-request
name: Search city case/spacing (%20settat%20 → MARRAKECH)
url: "{{baseUrl}}/api/trips/search?departureCity= settat &arrivalCity=MARRAKECH&date={{day5}}"
method: GET
headers:
  Content-Type: application/json
queryParams:
  departureCity: " settat "
  arrivalCity: MARRAKECH
  date: "{{day5}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const tripId = pm.collectionVariables.get('tripId');
      const found = pm.response.json().content.find(t => String(t.tripId) === String(tripId));
      pm.test('contains tripId (case/space insensitive)', () => pm.expect(found).to.not.be.undefined);
    language: text/javascript
order: 8000
