$kind: http-request
name: Search maxPrice=120 Rabat→Marrakech (contains tripId, segmentPrice 120)
url: "{{baseUrl}}/api/trips/search?departureCity=Rabat&arrivalCity=Marrakech&date={{day5}}&maxPrice=120"
method: GET
headers:
  Content-Type: application/json
queryParams:
  departureCity: Rabat
  arrivalCity: Marrakech
  date: "{{day5}}"
  maxPrice: "120"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const tripId = pm.collectionVariables.get('tripId');
      const found = pm.response.json().content.find(t => String(t.tripId) === String(tripId));
      pm.test('contains tripId with segmentPrice 120', () => {
          pm.expect(found).to.not.be.undefined;
          pm.expect(Number(found.segmentPrice)).to.eql(120);
      });
    language: text/javascript
order: 3000
