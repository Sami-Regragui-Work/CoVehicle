$kind: http-request
name: Search maxPrice=60 Settat→Marrakech (contains tripId, segment 50)
url: "{{baseUrl}}/api/trips/search?departureCity=Settat&arrivalCity=Marrakech&date={{day5}}&maxPrice=60"
method: GET
headers:
  Content-Type: application/json
queryParams:
  departureCity: Settat
  arrivalCity: Marrakech
  date: "{{day5}}"
  maxPrice: "60"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const tripId = pm.collectionVariables.get('tripId');
      const found = pm.response.json().content.find(t => String(t.tripId) === String(tripId));
      pm.test('contains tripId (segment 50 <= 60)', () => pm.expect(found).to.not.be.undefined);
    language: text/javascript
order: 1000
