$kind: http-request
url: "{{baseUrl}}/api/drivers/1/vehicles"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "brand": "Dacia",
      "model": "Logan",
      "color": "Grey",
      "licensePlate": "HAM-1234",
      "capacity": 4
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 409', () => pm.response.to.have.status(409));
    language: text/javascript
order: 6000
