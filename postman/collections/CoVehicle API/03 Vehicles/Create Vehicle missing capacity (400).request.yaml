$kind: http-request
url: "{{baseUrl}}/api/drivers/1/vehicles"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "brand": "Ford",
      "model": "Ka",
      "color": "Red",
      "licensePlate": "KA-001"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 8000
