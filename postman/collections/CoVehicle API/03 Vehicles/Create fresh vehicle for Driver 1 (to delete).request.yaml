$kind: http-request
url: "{{baseUrl}}/api/drivers/1/vehicles"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "brand": "Kia",
      "model": "Picanto",
      "color": "White",
      "licensePlate": "DEL-{{$timestamp}}",
      "capacity": 4
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('deletableVehicleId', pm.response.json().id);
    language: text/javascript
order: 13000
