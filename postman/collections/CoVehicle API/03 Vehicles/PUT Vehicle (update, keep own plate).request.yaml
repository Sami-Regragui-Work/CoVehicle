$kind: http-request
url: "{{baseUrl}}/api/drivers/1/vehicles/{{newVehicleId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "brand": "Ford",
      "model": "Focus",
      "color": "Black",
      "licensePlate": "{{newVehiclePlate}}",
      "capacity": 4
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
