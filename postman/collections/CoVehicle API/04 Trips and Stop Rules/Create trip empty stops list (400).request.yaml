$kind: http-request
url: "{{baseUrl}}/api/drivers/1/trips"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "vehicleId": 1,
      "seatsOffered": 3,
      "stops": []
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 8000
