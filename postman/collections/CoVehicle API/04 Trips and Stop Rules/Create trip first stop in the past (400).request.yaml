$kind: http-request
url: "{{baseUrl}}/api/drivers/1/trips"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "vehicleId": 1,
      "seatsOffered": 3,
      "stops": [
        {
          "city": "Rabat",
          "arrivalTime": "2000-01-01T10:00:00",
          "priceFromStart": 0
        },
        {
          "city": "Casablanca",
          "arrivalTime": "2000-01-01T11:00:00",
          "priceFromStart": 40
        }
      ]
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 2000
